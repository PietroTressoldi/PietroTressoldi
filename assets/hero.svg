<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pietro Tressoldi — C# / .NET back-end developer</title>
  <desc id="desc">Pietro Tressoldi builds services that run in production: Windows Services, Worker Services and AWS SQS consumers. A service list shows a worker consuming SQS, a Windows print-accounting service and the Chalé Alto do Morro booking API running, and GuitarTrek marked as learning.</desc>

  <rect width="1200" height="300" rx="24" fill="#0d1117"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#a48bff">C# · .NET · BACK-END</text>
    <text x="62" y="140" font-size="60" font-weight="700" fill="#e6edf3">Pietro Tressoldi</text>
    <text x="64" y="186" font-size="24" fill="#c9d1d9">Services that run in production: Windows</text>
    <text x="64" y="218" font-size="24" fill="#c9d1d9">Services, Worker Services and AWS SQS.</text>
    <text x="64" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7d8590">RS, Brazil · open to remote part-time roles</text>
  </g>

  <g id="services" transform="translate(712 34)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect width="440" height="236" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="24" y="40" fill="#7d8590">SERVICE</text>
    <text x="300" y="40" fill="#7d8590">STATE</text>
    <line x1="24" y1="56" x2="416" y2="56" stroke="#30363d" stroke-width="1.5"/>
    <text x="24" y="92" fill="#e6edf3">worker.sqs-consumer</text>
    <circle cx="306" cy="86" r="6" fill="#3fb950"/><text x="320" y="92" fill="#3fb950">RUNNING</text>
    <text x="24" y="132" fill="#e6edf3">win.print-accounting</text>
    <circle cx="306" cy="126" r="6" fill="#3fb950"/><text x="320" y="132" fill="#3fb950">RUNNING</text>
    <text x="24" y="172" fill="#e6edf3">api.chale-bookings</text>
    <circle cx="306" cy="166" r="6" fill="#3fb950"/><text x="320" y="172" fill="#3fb950">RUNNING</text>
    <text x="24" y="212" fill="#e6edf3">web.guitartrek</text>
    <circle cx="306" cy="206" r="6" fill="none" stroke="#a48bff" stroke-width="2"/><text x="320" y="212" fill="#a48bff">LEARNING</text>
  </g>
</svg>
