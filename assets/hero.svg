    <text x="62" y="140" font-size="60" font-weight="700" fill="#e6edf3">Pietro Tressoldi</text>
    <text x="64" y="186" font-size="24" fill="#c9d1d9">Services that run in production: Windows</text>
    <text x="64" y="218" font-size="24" fill="#c9d1d9">Services, Worker Services and AWS SQS.</text>
    <text x="64" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7d8590">Rio Grande do Sul, Brazil · guitarist</text>
  </g>

  <g id="stack" transform="translate(680 26)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
