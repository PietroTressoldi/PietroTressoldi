<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pietro Tressoldi — C# / .NET back-end developer</title>
  <desc id="desc">Pietro Tressoldi builds services that run in production: Windows Services, Worker Services and AWS SQS. Stack: .NET Framework and .NET 6 to 10, Windows and Worker Services, AWS SQS, PostgreSQL, MySQL and SQLite, Windows Forms; learning React and TypeScript.</desc>

